# .github/workflows/build.yml
name: Build Android APK

# 指定触发工作流的条件：当推送一个以 'v' 开头的标签时，例如 v1.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 指定运行环境为最新的 Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的仓库代码
      - uses: actions/checkout@v4

      # 2. 设置 Java 环境 (Android 构建需要)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Node.js 环境 (如果项目是 Web 技术或 React Native)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. 安装项目依赖 (根据你的项目调整)
      - name: Install dependencies
        run: |
          npm install
          # 如果你的项目需要，在此处添加构建命令，例如 npm run build

      # 5. 构建 APK (这里以 Capacitor/Ionic 为例)
      - name: Build APK
        run: |
          npx cap sync android
          npx cap build android --androidreleasetype APK

      # 6. 上传构建产物 (APK 文件)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
